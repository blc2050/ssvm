name: Daily Attendance Tracker

on:
  schedule:
    # Runs daily at 11:30 AM IST (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web / app anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Daily Attendance Scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python daily_absent_tracker.py

      - name: Commit and push attendance update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html *absent.xls
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update daily attendance $(date +'%d-%m-%Y')"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break || {
                echo "Push attempt $attempt failed; retrying in 3s..."
                sleep 3
              }
            done
          else
            echo "No changes to commit."
          fi
